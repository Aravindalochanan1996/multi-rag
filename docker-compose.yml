services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: career
    command: [ "postgres", "-p", "5435" ]
    ports: [ "5435:5435" ]
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -p 5435 -U app -d career" ]
      interval: 5s
      retries: 10

  # Optional bundled Ollama: `docker compose --profile ollama up`, then set
  # OLLAMA_BASE_URL=http://ollama:11434 in .env. By default the api talks to Ollama on the host.
  ollama:
    image: ollama/ollama:latest
    profiles: [ "ollama" ]
    ports: [ "11434:11434" ]
    volumes: [ ollama:/root/.ollama ]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@db:5435/career
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts: [ "host.docker.internal:host-gateway" ]
    depends_on:
      db: { condition: service_healthy }
    ports: [ "${API_PORT:-8091}:8000" ]

  web:
    build: ./frontend
    depends_on: [ api ]
    ports: [ "${WEB_PORT:-8090}:80" ]

volumes:
  pgdata:
  ollama:
